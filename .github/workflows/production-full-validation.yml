name: Protected full validation seed

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Reviewed stage; business RESET is a separate pre-migration operation"
        required: true
        type: choice
        options: [prepare, business, invitations, coverage, certificates]
      mode:
        description: "PLAN first; APPLY requires that stage's reviewed hash"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      approved_release_sha:
        description: "Exact deployed master SHA with complete first-pass CI and READY alias"
        required: true
        type: string
      release_ci_run_id:
        description: "Successful master push CI for that SHA"
        required: true
        type: string
      operation_id:
        description: "UUID of the approved completed pre-migration RESET receipt"
        required: true
        type: string
      reviewed_plan_sha256:
        description: "Required for APPLY; stage PLAN hash approved by operator"
        required: false
        type: string
      anchor_day:
        description: "Frozen reviewed Bolivia date YYYY-MM-DD; never move on replay"
        required: true
        type: string
      retained_account_plan:
        description: "Reviewed JSON {instructors:[four active UUIDs],operatorId:synthetic ADMIN UUID,disabledInstructorId:spare retained UUID}"
        required: true
        type: string
      name_edit_plan:
        description: "Reviewed JSON array of exact profile name edits; [] preserves natural names"
        required: true
        default: "[]"
        type: string
      allow_synthetic_final:
        description: "Certificates APPLY only: marked test documents, never institutional signatures"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-demo-fvzxqlezdrlzykyoevub
  cancel-in-progress: false

jobs:
  operator:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'SteveCasTo/skillbase'
    environment: production
    runs-on: ubuntu-latest
    # Observed cloud stage sends ~4525 validated service queries; at measured
    # ~3.1 queries/s it needs ~24min. Keep a finite operator-only margin.
    # Product/CI/E2E test timeouts and retries are intentionally unchanged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Reviewed stage on exact READY release
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEMO_APPROVED_RELEASE_SHA: ${{ inputs.approved_release_sha }}
          DEMO_RELEASE_CI_RUN_ID: ${{ inputs.release_ci_run_id }}
          DEMO_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DEMO_SUPABASE_URL: https://fvzxqlezdrlzykyoevub.supabase.co
          DEMO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_ADMIN_ID: ${{ vars.DEMO_ADMIN_ID }}
          VALIDATION_STAGE: ${{ inputs.stage }}
          VALIDATION_MODE: ${{ inputs.mode }}
          VALIDATION_OPERATION_ID: ${{ inputs.operation_id }}
          VALIDATION_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          VALIDATION_ANCHOR: ${{ inputs.anchor_day }}
          VALIDATION_ACCOUNTS: ${{ inputs.retained_account_plan }}
          VALIDATION_NAME_EDITS: ${{ inputs.name_edit_plan }}
          VALIDATION_SYNTHETIC_FINAL: ${{ inputs.allow_synthetic_final }}
        run: bun scripts/production-full-validation.ts
      - name: Upload only successful redacted stage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ inputs.stage }}-${{ inputs.mode }}-summary
          path: ${{ runner.temp }}/full-validation-summary.json
          if-no-files-found: error
          retention-days: 7

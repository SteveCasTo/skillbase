name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PUBLIC_SITE_URL: http://127.0.0.1:4321
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            server-port: 44891
          - shard: 2
            server-port: 44892
    env:
      E2E_SERVER_PORT: ${{ matrix.server-port }}
      E2E_EVIDENCE_DIR: e2e-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e-evidence/
            blob-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  integration-e2e:
    if: always()
    needs: [quality, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality, integration and E2E jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$QUALITY_RESULT" = success && test "$INTEGRATION_RESULT" = success && test "$E2E_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-shard-*
          path: shard-reports
      - name: Verify complete cohort and report timings/flakes/retries
        run: bun scripts/verify-e2e-shards.ts shard-reports/e2e-shard-1/e2e-evidence shard-reports/e2e-shard-2/e2e-evidence

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.quality.result == 'success' && needs.integration-e2e.result == 'success'
    needs: [quality, integration-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Apply production migrations
        run: bunx drizzle-kit migrate
      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production output
        run: bunx vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production output
        run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

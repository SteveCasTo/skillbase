name: Production demo operator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PLAN is read-only; APPLY appends the reviewed demo once"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: production-demo-fvzxqlezdrlzykyoevub
  cancel-in-progress: false

jobs:
  operator:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'SteveCasTo/skillbase'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run protected production operator
        env:
          OPERATOR_MODE: ${{ inputs.mode }}
          DEMO_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DEMO_SUPABASE_URL: https://fvzxqlezdrlzykyoevub.supabase.co
          DEMO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_ADMIN_ID: ${{ vars.DEMO_ADMIN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--target production --project fvzxqlezdrlzykyoevub --attendance --approved-production-operator)
          case "$OPERATOR_MODE" in
            plan) ;;
            apply) args+=(--apply) ;;
            *) echo "Invalid operator mode" >&2; exit 1 ;;
          esac
          bun scripts/financial-demo.ts "${args[@]}"
